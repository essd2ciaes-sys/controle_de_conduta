<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Conduta Escolar</title>

<style>

/* PADRONIZAÇÃO GLOBAL */
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('fundo_escola.jpg') no-repeat center center fixed;
    background-size: cover;
}

/* Overlay */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(23, 26, 74, 0.8);
    z-index: -1;
}

/* HEADER */
header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, #000000, #171A4A);
    color: white;
    padding: 10px 30px;
    position: relative;
    border-bottom: 15px solid #808080;
    min-height: 120px;
}

header::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 9px;
    background: linear-gradient(to bottom,#FF0000 0,#FF0000 3px,#000000 3px,#000000 6px,#808080 6px,#808080 9px);
}

header h2 {
    flex: 1;
    text-align: center;
    margin: 0;
    font-size: 22px;
    font-weight: bold;
}

.logo {
    height: 120px;
    filter: drop-shadow(0 0 6px black);
}

/* CARD */
.container {
    max-width: 850px;
    margin: 40px auto;
    background: rgba(0,0,0,0.9);
    padding: 30px;
    border-radius: 10px;
    color: white;
}

label {
    display: block;
    margin-top: 18px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    height: 42px;
    padding: 10px;
    margin-top: 5px;
    border-radius: 5px;
    border: none;
    background: #808080;
    font-weight: bold;
    font-size: 14px;
}

/* MAIÚSCULO VISUAL */
input[type="text"], textarea {
    text-transform: uppercase;
}

textarea {
    height: 80px;
    resize: none;
}

/* remover setas */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
}
input[type=number] { -moz-appearance: textfield; }

input:focus, select:focus, textarea:focus {
    outline: none;
    background: #FFFFFF;
}

/* BOTÃO */
button {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, #FF0000, #990000);
    color: white;
    border: none;
    font-weight: bold;
    border-radius: 5px;
}

/* aviso */
.aviso {
    margin-top: 20px;
    text-align: center;
    color: #FF0000;
    font-weight: bold;
}

/* footer */
footer {
    background: black;
    color: white;
    text-align: center;
    padding: 15px;
    border-top: 2px solid red;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    header { flex-direction: column; }
    .logo { height: 80px; }
    header h2 { font-size: 18px; margin: 10px 0; }
    .container { margin: 10px; padding: 20px; }
}

</style>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxkQnH7aHsnVgNOkiyByxr3llq4DfSNqUroXEne40e4md0a8K-gXJjHs4AJcm8NJJM/exec";

// máscara RE
function formatarRE(campo) {
    let v = campo.value.toUpperCase().replace(/[^0-9A-Z]/g,'');

    if (v.length > 6) {
        campo.value = v.substring(0,6) + '-' + v.substring(6,7);
    } else {
        campo.value = v;
    }
}
// letras maiúsculas reais
function apenasLetras(e){
    e.target.value = e.target.value
        .replace(/[^A-Za-zÀ-ÿ\s]/g,'')
        .toUpperCase();
}

// 🔵 AUTOPREENCHIMENTO ALUNO
async function buscarAluno() {
    const re = document.getElementById("re").value;

    if(re.length < 8) return;

    try {
        const res = await fetch(API_URL + "?tipo=alunos");
        const lista = await res.json();

        const aluno = lista.find(a => 
    a.re.trim().toUpperCase() === re.trim().toUpperCase()
);

        if(aluno){
            nome.value = aluno.nome;
            cia.value = aluno.cia;
            pelotao.value = aluno.pelotao;
            aluno.value = aluno.aluno;
        }
    } catch(e){
        console.log("Erro GET alunos", e);
    }
}

// 🔴 AUTOPREENCHIMENTO ANOTANTE
async function buscarAnotante() {
    const re = document.getElementById("re_anotante").value;

    if(re.length < 8) return;

    try {
        const res = await fetch(API_URL + "?tipo=anotantes");
        const lista = await res.json();

        const anot = lista.find(a => 
    a.re.trim().toUpperCase() === re.trim().toUpperCase()
);
        if(anot){
            anotante.value = anot.nome;
            cargo.value = anot.cargo;
        }
    } catch(e){
        console.log("Erro GET anotantes", e);
    }
}

// envio
async function enviarFormulario(e){
    e.preventDefault();

    const dados = {
        re: re.value,
        nome: nome.value,
        cia: cia.value,
        pelotao: pelotao.value,
        aluno: aluno.value,
        datahora: datahora.value,
        descricao: descricao.value,
        codigo: codigo.value,
        ciencia: ciencia.value,
        anotante: anotante.value,
        re_anotante: re_anotante.value,
        cargo: cargo.value
    };

    await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(dados)
    });

    alert("Registro enviado com sucesso!");
    document.querySelector("form").reset();
}

</script>

</head>

<body>

<header>
    <img src="logo_pm.png" class="logo">
    <h2>CONTROLE DE CONDUTA ESCOLAR</h2>
    <img src="logo_essd.png" class="logo">
</header>

<div class="container">
<form onsubmit="enviarFormulario(event)">

<label>RE</label>
<input id="re" maxlength="8" pattern="[0-9]{6}-[A-Z0-9]" 
oninput="formatarRE(this)" onblur="buscarAluno()" required>

<label>Nome de Guerra</label>
<input id="nome" maxlength="20" oninput="apenasLetras(event)" required>

<label>CIA</label>
<select id="cia">
<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
</select>

<label>Pelotão</label>
<input id="pelotao" type="number" max="99" required>

<label>Nº Aluno</label>
<input id="aluno" type="number" max="99" required>

<label>Data e Hora</label>
<input id="datahora" type="datetime-local" required>

<label>Descrição de Conduta Infratora</label>
<textarea id="descricao" maxlength="50" oninput="apenasLetras(event)" required></textarea>

<label>Cód. D-5 PM</label>
<select id="codigo">
<option>A1</option><option>B1</option><option>C1</option><option>C2</option><option>C3</option>
<option>D1</option><option>D7</option><option>E1</option><option>E2</option><option>E3</option>
<option>E4</option><option>E5</option><option>E6</option>
<option>F1</option><option>F2</option><option>F3</option><option>F4</option>
<option>F5</option><option>F6</option><option>F7</option>
<option>G1</option><option>G2</option><option>G3</option><option>G4</option>
<option>G5</option><option>G6</option><option>G7</option>
<option>G10</option><option>G11</option>
<option>H2</option><option>H3</option>
<option>I2</option><option>I3</option>
</select>

<label>Data e Hora da Ciência</label>
<input id="ciencia" type="datetime-local" required>

<label>RE Anotante</label>
<input id="re_anotante" maxlength="8" pattern="[0-9]{6}-[A-Z0-9]" 
oninput="formatarRE(this)" onblur="buscarAnotante()" required>

<label>Anotante</label>
<input id="anotante" maxlength="50" oninput="apenasLetras(event)" required>

<label>Cargo/Função</label>
<input id="cargo" maxlength="20" oninput="apenasLetras(event)" required>

<div class="aviso">
Artigo 128 da D-5-PM: Prazo de recurso de 24h após a ciência.
</div>

<button type="submit">REGISTRAR OCORRÊNCIA</button>

</form>
</div>

<footer>
© 2026 Polícia Militar do Estado de São Paulo - ESSD
</footer>

</body>
</html>
